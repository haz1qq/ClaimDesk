# Local infrastructure only: one Postgres (two databases) and a single-node Kafka broker.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # With no KAFKA_* variables, this image runs its built-in single-node KRaft
    # config (broker + controller in one process) advertised on localhost:9092.
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"

volumes:
  pgdata:
