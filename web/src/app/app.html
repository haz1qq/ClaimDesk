<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">ClaimDesk</a>

    <nav aria-label="Main">
      @switch (currentUser.user()?.role) {
        @case ('Claimant') {
          <a routerLink="/claims" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My claims</a>
          <a routerLink="/claims/new" routerLinkActive="active">Report an incident</a>
        }
        @case ('Officer') {
          <a routerLink="/work" routerLinkActive="active">Work queue</a>
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        }
        @case ('Manager') {
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        }
      }
    </nav>

    <label class="user-switch">
      <span>Signed in as</span>
      <select (change)="choose($event)">
        <option value="" disabled [selected]="!currentUser.user()">Choose a user…</option>
        @for (group of groups(); track group.role) {
          <optgroup [label]="group.label">
            @for (user of group.users; track user.id) {
              <option [value]="user.id" [selected]="user.id === currentUser.userId()">{{ user.name }}</option>
            }
          </optgroup>
        }
      </select>
    </label>
  </div>
</header>

<main id="main" class="container">
  <router-outlet />
</main>
